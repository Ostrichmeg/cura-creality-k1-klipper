# Changes to printer.cfg of the Creality K1 (Klipper with Creality Helper Script)
# The blocks replace or extend the sections of the same name in printer.cfg.
# All lines must start in the first column (no indentation before section names).

# 9x9 mesh instead of 5x5. More than 6 points per axis require "bicubic".
[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
probe_count: 9,9
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 5.0
fade_end: 50.0

# Override the switches of the KAMP start macro (Helper-Script/KAMP/Start_Print.cfg).
# The KAMP files themselves are read-only, hence the override in printer.cfg.
# Insert above the SAVE_CONFIG block.

# 0 = classic purge line at the bed edge, 1 = adaptive purge line next to the object
[output_pin ADAPTIVE_PURGE_LINE]
value: 0

# 0 = no mesh before the print, the saved profile "default" is loaded
# 1 = adaptive mesh before every print
[output_pin ADAPTIVE_BED_MESH]
value: 0
